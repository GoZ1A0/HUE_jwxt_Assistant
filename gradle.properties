# Gradle 守护进程与内存设置
# 注：本工程目录名含中文。Gradle 测试 worker 用 @argfile 传超长 classpath 时，
# 守护进程写 argfile 的编码必须与 java.exe 启动器读取 Argfile 的本地编码一致，否则
# classpath 中的中文路径会乱码、测试类全部 ClassNotFoundException。
# 默认保持 UTF-8（可移植，构建正常）；在本机（中文 Windows，ANSI=GBK）跑测试请使用：
#   .\gradlew.bat "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=GBK" :app:testDebugUnitTest
# 详见 README「测试」与 docs/verification.md。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# 本工程位于含中文的目录名（仓库根目录名含中文）。
# AGP 默认会因非 ASCII 工程路径直接报错，这里关闭该检查；Windows + AGP 8.13 实测可正常构建。
android.overridePathCheck=true

# Kotlin
kotlin.code.style=official
